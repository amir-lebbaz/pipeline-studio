name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/PipelineStudio-v1.2.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PipelineStudio-v1.2-apk
          path: release-assets/PipelineStudio-v1.2.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2
          name: "Pipeline Studio v1.2"
          body: |
            ## Pipeline Studio v1.2

            Offline native Android CPU Pipeline and Hazards Simulator for Computer Architecture II (Université Amar Telidji – Laghouat).

            ### Direct Download
            Click below to download and install the APK directly on your Android phone:
            - **[Download PipelineStudio-v1.2.apk](https://github.com/amir-lebbaz/pipeline-studio/releases/download/v1.2/PipelineStudio-v1.2.apk)**

            ### What's New in v1.2
            - **All 5 Hazard Types Detected**: Complete detection, chronogram scheduling, and diagnosis for RAW, WAR, WAW, Control (Branch), and Structural hazards.
            - **Memory Architecture Toggle**: Segmented switch between Harvard Architecture (separate I/D Caches, 0 structural stalls) and Unified Memory (Von Neumann single-port bus collision).
            - **Academic Solutions for Every Hazard**: 4-line diagnostic cards explaining root causes, cycle impacts, and university-standard resolutions (Forwarding, Reordering, Register Renaming, BTB, Harvard caches).
            - **All Hazards Demo Preset**: Instant one-click preset loading a real instruction sequence triggering all 5 hazards.
            - **Dedicated Theory & Hazards Guide**: Full academic reference covering all pipeline hazard types and resolution methods.
            - **Developer Profile Screen**: Dedicated About page for Amir Lebbaz, university context, and open-source references.
            - **Enhanced Navigation**: Seamless Bento header pills to jump between Simulator, Theory, and About with full Arabic and English RTL/LTR support.
          files: release-assets/PipelineStudio-v1.2.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
