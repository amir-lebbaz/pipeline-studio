name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/PipelineStudio-v1.1.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PipelineStudio-v1.1-apk
          path: release-assets/PipelineStudio-v1.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1
          name: "Pipeline Studio v1.1"
          body: |
            ## Pipeline Studio v1.1

            Offline native Android CPU Pipeline and Hazards Simulator for Computer Architecture II (Université Amar Telidji – Laghouat).

            ### Direct Download
            Click below to download and install the APK directly on your Android phone:
            - **[Download PipelineStudio-v1.1.apk](https://github.com/amir-lebbaz/pipeline-studio/releases/download/v1.1/PipelineStudio-v1.1.apk)**

            ### What's New in v1.1
            - **Dedicated Theory & Hazards Guide**: Full academic reference covering all pipeline hazard types (RAW, WAR, WAW, Control, Structural) and resolution methods (Stalls, Forwarding, Reordering, Branch Prediction).
            - **Developer Profile Screen**: Dedicated About page for Amir Lebbaz, university context, and open-source references.
            - **Complete Hazard Detection**: Active diagnosis and badge reporting for WAR (Anti-dependency) and WAW (Output dependency) alongside RAW and branch penalties.
            - **Enhanced Navigation**: Seamless Bento header pills to jump between Simulator, Theory, and About with full Arabic and English RTL/LTR support.
          files: release-assets/PipelineStudio-v1.1.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
