name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/PipelineStudio-v1.0.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PipelineStudio-v1.0-apk
          path: release-assets/PipelineStudio-v1.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: "Pipeline Studio v1.0"
          body: |
            ## Pipeline Studio v1.0
            
            Offline native Android CPU Pipeline and Hazards Simulator for Computer Architecture II (Université Amar Telidji – Laghouat).
            
            ### Direct Download
            Click below to download and install the APK directly on your Android phone:
            - **[Download PipelineStudio-v1.0.apk](https://github.com/amir-lebbaz/pipeline-studio/releases/download/v1.0/PipelineStudio-v1.0.apk)**
            
            ### Features
            - **4-Stage Model**: Fetch, Decode, Execute, Write Back (`F - D - E - WB`).
            - **5-Stage Model**: Instruction Fetch, Instruction Decode, Execute, Memory Access, Write Back (`IF - ID - EX - MEM - WB`).
            - **Hazard Detection**: Real-time RAW data hazards with x86 register aliasing, branch control flushes, and structural hazards.
            - **Mitigation Techniques**: Stalls (Bulles), Data Forwarding (Anticipation), and Instruction Reordering (Réordonnancement).
            - **Interactive Chronogram**: Cycle-by-cycle execution grid (`CC1 -> CCn`).
            - **Bilingual Interface**: Arabic and English with seamless RTL/LTR layout switching and technical LTR lock for assembly code.
          files: release-assets/PipelineStudio-v1.0.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
